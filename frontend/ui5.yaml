# ui5 serve against a locally running backend (cd backend && dub run)
specVersion: "4.0"
metadata:
  name: uim.ecm
type: application
resources:
  configuration:
    paths:
      webapp: .
builder:
  resources:
    excludes:
      - "/node_modules/**"
      - "/nginx/**"
      - "/Dockerfile"
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /odata
      configuration:
        baseUri: "http://localhost:8080/odata"
