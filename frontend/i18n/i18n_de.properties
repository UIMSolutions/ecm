help.start.title=Erste Schritte
help.start.text=Melden Sie sich mit Mandant, Benutzername und Passwort an (oder per Single Sign-on). Die Sitzung verlängert sich automatisch, solange Sie aktiv sind; über das Benutzermenü ändern Sie Ihr Passwort oder melden sich ab. Oben wählen Sie den Arbeitsbereich; links stehen die Ordner, rechts die Dokumente.\nMit „Neues Dokument“ legen Sie ein Dokument an, mit dem Hochladen-Symbol in der Zeile laden Sie die Datei hoch. Ein Klick auf den Namen lädt sie herunter.
help.documents.title=Dokumente und Ordner
help.documents.text=Dokumente haben den Status Entwurf, Veröffentlicht oder Archiviert. Veröffentlichen ist erst möglich, wenn eine Datei hochgeladen wurde. Archivierte Dokumente sind schreibgeschützt.\nOrdner gehören immer zu einem Arbeitsbereich und lassen sich nur löschen, wenn sie leer sind. Die Rolle „viewer“ darf nur lesen.
help.search.title=Suche
help.search.text=Die Suche durchsucht Name, Titel und Inhalt (Text, Markdown, HTML, CSV, JSON, Word, Excel, PowerPoint und OpenDocument; PDFs nur nach Name und Titel).\nAlle Suchwörter müssen vorkommen, das letzte Wort darf unvollständig sein: „vertr kün“ findet „Vertrag Kündigung“. Die Treffer sind nach Relevanz sortiert. Neue Dokumente sind nach wenigen Sekunden durchsuchbar.
help.workspaces.title=Arbeitsbereiche und Rollen
help.workspaces.text=Ein Arbeitsbereich trennt Dokumente und Zugriffe. Sie sehen nur Arbeitsbereiche, in denen Sie Mitglied sind; Ihre Rolle steht in der Auswahl oben.\nArbeitsbereich-Admins verwalten die Mitglieder über „Mitglieder“. Mandanten-Admins legen Arbeitsbereiche über „Arbeitsbereiche“ an und sind überall Admin.
help.notifications.title=Benachrichtigungen
help.notifications.text=Die Glocke zeigt ungelesene Meldungen, zum Beispiel wenn jemand ein Dokument veröffentlicht oder archiviert oder wenn sich Ihre Mitgliedschaft ändert. Ein Klick öffnet den Arbeitsbereich und markiert die Meldung als gelesen; mit dem Kreuz löschen Sie sie.\nEs werden die neuesten 200 Meldungen aufbewahrt. Die Anzeige aktualisiert sich etwa jede Minute, solange der Tab sichtbar ist.
help.admin.title=Administration
help.admin.text=Unter „Benutzer“ legen Mandanten-Admins Benutzer an, ändern Rollen, setzen Passwörter und deaktivieren Konten. Der letzte aktive Admin kann nicht entfernt werden.\n„Suchindex neu aufbauen“ liest alle Dokumente neu ein und läuft im Hintergrund.
help.platform.title=Plattform-Administration
help.platform.text=Als Plattform-Admin verwalten Sie Mandanten (anlegen, deaktivieren) und legen deren erste Administratoren unter „Benutzer“ an. Auf Dokumente haben Sie bewusst keinen Zugriff.
