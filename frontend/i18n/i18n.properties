help.start.title=Getting started
help.start.text=Sign in with tenant, user name and password (or via single sign-on). Your session is extended automatically while you are active; use the user menu to change your password or sign out.\nChoose the workspace at the top; folders are on the left, documents on the right. "New document" creates a document, the upload icon in its row uploads the file, and clicking the name downloads it.
help.documents.title=Documents and folders
help.documents.text=Documents are Draft, Published or Archived. Publishing requires uploaded content. Archived documents are read-only.\nFolders always belong to one workspace and can only be deleted when empty. The "viewer" role is read-only.
help.search.title=Search
help.search.text=Search covers name, title and content (text, Markdown, HTML, CSV, JSON, Word, Excel, PowerPoint and OpenDocument; PDFs by name and title only).\nAll words must occur, the last one may be incomplete: "contr term" finds "contract termination". Hits are ranked by relevance. New documents become searchable within a few seconds.
help.workspaces.title=Workspaces and roles
help.workspaces.text=A workspace separates documents and access. You only see workspaces you are a member of; your role is shown in the selector at the top.\nWorkspace admins manage members under "Members". Tenant admins create workspaces under "Workspaces" and are admins everywhere.
help.notifications.title=Notifications
help.notifications.text=The bell shows unread messages, e.g. when someone publishes or archives a document or your membership changes. Clicking one opens the workspace and marks it as read; the cross deletes it.\nThe newest 200 messages are kept. The counter refreshes about once a minute while the tab is visible.
help.admin.title=Administration
help.admin.text=Under "Users" tenant admins create users, change roles, reset passwords and deactivate accounts. The last active admin cannot be removed.\n"Rebuild search index" re-reads all documents in the background.
help.platform.title=Platform administration
help.platform.text=As platform admin you manage tenants (create, deactivate) and create their first administrators under "Users". You deliberately have no access to documents.
