# Replace REGISTRY with your registry. Also usable with: podman kube play deploy/k8s/ecm.yaml
apiVersion: v1
kind: Secret
metadata: { name: ecm-secrets }
type: Opaque
stringData:
  jwt-secret: "CHANGE-ME-random-value-with-at-least-32-characters"
  admin-password: "CHANGE-ME-initial-tenant-admin-password"
  platform-admin-password: "CHANGE-ME-initial-platform-admin-password"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ecm-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ecm-backend, labels: { app: ecm-backend } }
spec:
  replicas: 1            # JSON-file adapter = single writer; use a DB adapter to scale out
  strategy: { type: Recreate }
  selector: { matchLabels: { app: ecm-backend } }
  template:
    metadata: { labels: { app: ecm-backend } }
    spec:
      terminationGracePeriodSeconds: 30   # lets the backend drain jobs and flush its journals
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: backend
          image: REGISTRY/ecm-backend:1.0.0
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ECM_DATA_DIR, value: /data }
            - { name: ECM_WORKERS, value: "4" }   # keep equal to the CPU limit
            - { name: ECM_JWT_SECRET, valueFrom: { secretKeyRef: { name: ecm-secrets, key: jwt-secret } } }
            - { name: ECM_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: ecm-secrets, key: admin-password } } }
            - { name: ECM_PLATFORM_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: ecm-secrets, key: platform-admin-password } } }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: "2", memory: 1Gi }, limits: { cpu: "4", memory: 2Gi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: ecm-data }
---
apiVersion: v1
kind: Service
metadata: { name: ecm-backend }
spec:
  selector: { app: ecm-backend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ecm-frontend, labels: { app: ecm-frontend } }
spec:
  replicas: 3
  selector: { matchLabels: { app: ecm-frontend } }
  template:
    metadata: { labels: { app: ecm-frontend } }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: frontend
          image: REGISTRY/ecm-frontend:1.0.0
          ports: [{ containerPort: 8080 }]
          env:
            - { name: BACKEND_URL, value: "http://ecm-backend:8080" }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
          resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: ecm-frontend }
spec:
  selector: { app: ecm-frontend }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: ecm }
spec:
  rules:
    - host: ecm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: ecm-frontend, port: { number: 80 } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ecm-frontend }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ecm-frontend }
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: ecm-frontend }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: ecm-frontend } }
