# docker compose -f deploy/compose.yaml up --build   |   podman compose -f deploy/compose.yaml up --build
# Set ECM_JWT_SECRET (>= 32 chars), ECM_PLATFORM_ADMIN_PASSWORD and ECM_ADMIN_PASSWORD, e.g. in a .env file next to this file.
services:
  backend:
    build: ../backend
    image: ecm-backend:latest
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      ECM_DATA_DIR: /data
      ECM_JWT_SECRET: ${ECM_JWT_SECRET:?set ECM_JWT_SECRET (min. 32 chars)}
      ECM_AUTH_MODE: local
      ECM_PLATFORM_ADMIN_PASSWORD: ${ECM_PLATFORM_ADMIN_PASSWORD:?set ECM_PLATFORM_ADMIN_PASSWORD for the first start}
      ECM_ADMIN_PASSWORD: ${ECM_ADMIN_PASSWORD:?set ECM_ADMIN_PASSWORD (default tenant admin) for the first start}
    volumes:
      - ecm-data:/data
  frontend:
    build: ../frontend
    image: ecm-frontend:latest
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "8080:8080"
    depends_on:
      - backend
volumes:
  ecm-data: {}
